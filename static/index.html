<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#eef4f1" />
    <title>JLPT 문법 학습</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="header-brand">
          <p class="eyebrow">JLPT</p>
          <h1>문법 학습</h1>
          <p id="header-greeting" class="header-greeting" hidden></p>
          <p id="header-context" class="header-context">로그인</p>
        </div>
        <div class="header-actions">
          <div id="header-user" class="header-user" hidden></div>
        </div>
      </header>

      <main>
        <section id="view-auth" class="view active" aria-labelledby="auth-title"></section>
        <section id="view-study" class="view" aria-labelledby="study-title"></section>
        <section id="view-cards" class="view" aria-labelledby="cards-title"></section>
        <section id="view-groups" class="view" aria-labelledby="groups-title"></section>
        <section id="view-settings" class="view" aria-labelledby="settings-title"></section>
      </main>
    </div>

    <nav class="bottom-nav" aria-label="주요 메뉴">
      <button class="nav-button active" type="button" data-tab="study">
        <span class="nav-icon" aria-hidden="true">回</span>
        <span>학습</span>
      </button>
      <button class="nav-button" type="button" data-tab="cards">
        <span class="nav-icon" aria-hidden="true">文</span>
        <span>카드</span>
      </button>
      <button class="nav-button" type="button" data-tab="groups">
        <span class="nav-icon" aria-hidden="true">組</span>
        <span>그룹</span>
      </button>
      <button class="nav-button" type="button" data-tab="settings">
        <span class="nav-icon" aria-hidden="true">設</span>
        <span>설정</span>
      </button>
    </nav>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="dialog-root"></div>
    <script src="/static/js/app-shared.js" defer></script>
    <script src="/static/js/storage.js" defer></script>
    <script src="/static/js/files.js" defer></script>
    <script src="/static/app.js" defer></script>
  </body>
</html>
