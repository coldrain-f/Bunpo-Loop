name: bunpo-loop

services:
  bunpo-loop:
    build: .
    container_name: bunpo-loop
    restart: unless-stopped
    ports:
      - "${BUNPO_LOOP_BIND:-127.0.0.1}:${BUNPO_LOOP_PORT:-8000}:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      BYEORAKCHIGI_DB: /data/bunpo-loop.sqlite3
      APP_USER: ${APP_USER:-}
      APP_PASSWORD: ${APP_PASSWORD:-}
      BUNPO_LOOP_SEED_DEFAULT_DATA: ${BUNPO_LOOP_SEED_DEFAULT_DATA:-1}
    volumes:
      - bunpo-loop-data:/data

volumes:
  bunpo-loop-data:
    name: bunpo-loop-data
